<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EHRDyn Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="masthead">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="site-title"></h1>
    <p class="tagline" id="tagline"></p>
    <p class="intro" id="intro"></p>
    <details class="howto" id="howto">
      <summary id="howto-summary"></summary>
      <ul id="how-to-read"></ul>
    </details>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-policies" data-tab="policies" aria-selected="true"></button>
    <button role="tab" id="tab-per_task" data-tab="per_task" aria-selected="false"></button>
    <button role="tab" id="tab-ope" data-tab="ope" aria-selected="false"></button>
    <button role="tab" id="tab-about" data-tab="about" aria-selected="false"></button>
  </nav>

  <section class="panel" id="policies" role="tabpanel">
    <div class="panel-head">
      <h2 id="policies-heading"></h2>
      <div class="toggle" role="group" aria-label="Simulator family">
        <button data-family="fitted" aria-pressed="true" id="fam-fitted-1"></button>
        <button data-family="controlled" aria-pressed="false" id="fam-controlled-1"></button>
      </div>
    </div>
    <p class="note" id="policies-note"></p>
    <figure class="forest" id="forest" aria-label="Difference from the best single control with 95% intervals"></figure>
    <p class="legend"><span class="key key-above"></span><span id="legend-above"></span><span class="key key-zero"></span><span id="legend-zero"></span><span class="key key-below"></span><span id="legend-below"></span></p>
    <div class="table-tools">
      <label class="visually-hidden" for="search" id="search-label"></label>
      <input id="search" type="search" autocomplete="off">
    </div>
    <div class="table-wrap">
      <table id="policy-table">
        <thead><tr></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <p class="note small" id="tasks-above-note"></p>
  </section>

  <section class="panel" id="per_task" role="tabpanel" hidden>
    <div class="panel-head">
      <h2 id="per-task-heading"></h2>
      <div class="toggle" role="group" aria-label="Simulator family">
        <button data-family="fitted" aria-pressed="true" id="fam-fitted-2"></button>
        <button data-family="controlled" aria-pressed="false" id="fam-controlled-2"></button>
      </div>
    </div>
    <p class="note" id="per-task-note"></p>
    <div class="table-wrap">
      <table id="heat-table" class="heat">
        <thead><tr></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <p class="scale-key"><span id="scale-low"></span><span class="ramp" aria-hidden="true"></span><span id="scale-high"></span></p>
  </section>

  <section class="panel" id="ope" role="tabpanel" hidden>
    <h2 id="ope-heading"></h2>
    <p class="note" id="ope-note"></p>
    <div class="ope-grid">
      <div class="card">
        <h3 id="ope-fitted-title"></h3>
        <div class="table-wrap"><table class="ope-table" data-family="EHR-fitted"><thead><tr></tr></thead><tbody></tbody></table></div>
      </div>
      <div class="card">
        <h3 id="ope-controlled-title"></h3>
        <div class="table-wrap"><table class="ope-table" data-family="Controlled"><thead><tr></tr></thead><tbody></tbody></table></div>
      </div>
    </div>
  </section>

  <section class="panel" id="about" role="tabpanel" hidden>
    <div class="about-grid">
      <div>
        <h2 id="about-heading"></h2>
        <p id="about-text"></p>
        <h2 id="submit-heading"></h2>
        <p id="submit-text"></p>
      </div>
      <aside class="card caveats">
        <h3 id="caveats-heading"></h3>
        <ul id="caveats"></ul>
      </aside>
    </div>
  </section>

  <footer class="foot"><span id="footer"></span></footer>
</div>
<script src="app.js"></script>
</body>
</html>
